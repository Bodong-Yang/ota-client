name: Offline OTA image builder Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Offline OTA image builder Release version (e.g. 1.0.0)"
        required: true
        type: string

  push:
    tags:
      - "offline_ota_image_builder_v*"

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    container:
      # glibc compatible with ubuntu:20.04 and newer
      image: debian:bullseye@sha256:6f519a81440354a85eb592c5f32109ab80605f6b892455983a6f618bf87fabe9

    steps:
      - name: Install system dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            git curl ca-certificates binutils

      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "version=${{ github.event.inputs.version }}" >> "$GITHUB_OUTPUT"
            echo "tag_name=offline_ota_image_builder_v${{ github.event.inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            # Extract version from tag: offline_ota_image_builder_v1.0.0 -> 1.0.0
            TAG="${GITHUB_REF#refs/tags/}"
            VERSION="${TAG#offline_ota_image_builder_v}"
            echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
            echo "tag_name=${TAG}" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version-file: "tools/offline_ota_image_builder/.python-version"

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: "0.12.9"

      - name: Build binary with PyInstaller
        working-directory: tools/offline_ota_image_builder
        run: |
          uv run --locked pyinstaller \
            --onefile -s \
            --name offline_ota_image_builder \
            --clean \
            src/offline_ota_image_builder/__main__.py

      - name: calculate checksum
        uses: ./.github/actions/calculate_checksum
        with:
          file_patterns: "*"
          directory: tools/offline_ota_image_builder/dist

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ steps.version.outputs.tag_name }}
          name: "Offline OTA Image Builder v${{ steps.version.outputs.version }}"
          files: |
            tools/offline_ota_image_builder/dist/*
